[green_agent]
# agentbeats_id = "019bbb38-e885-7000-8bd2-68e312757711"
image = "ghcr.io/udapy/medagentbench-green-agent:latest"
env = { OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}", NEBIUS_API_KEY = "${NEBIUS_API_KEY}", LOG_LEVEL = "INFO", FHIR_SERVER_URL = "http://fhir-server:8080" }

[[participants]]
# agentbeats_id = "019bbe64-089b-7e12-b003-61c1ffb61999"
image = "ghcr.io/udapy/medagentbench-purple-agent:latest"
name = "purple_agent"
env = { OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}", OPENROUTER_MODEL_NAME = "deepseek/deepseek-v3.2", NEBIUS_API_KEY = "${NEBIUS_API_KEY}", NEBIUS_MODEL_NAME = "deepseek-ai/DeepSeek-R1-0528", FHIR_SERVER_URL = "http://fhir-server:8080" }

[config]
# MedAgentBench Task configuration
task_ids = [
    "task1_1", "task1_2", "task1_3", "task1_4", "task1_5", "task1_6", "task1_7", "task1_8", "task1_9", "task1_10",
    "task2_1", "task2_2", "task2_3", "task2_4", "task2_5", "task2_6", "task2_7", "task2_8", "task2_9", "task2_10",
    "task3_1", "task3_2", "task3_3", "task3_4", "task3_5", "task3_6", "task3_7", "task3_8", "task3_9", "task3_10"
]
max_iterations = 3
